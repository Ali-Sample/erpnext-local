# Local vanilla ERPNext, based on frappe_docker's single-file quick start (pwd.yml).
# Run from WSL:  docker compose --env-file versions.env --env-file .env up -d
# Versions live in versions.env; passwords in .env (local only, never committed).

x-erpnext: &erpnext
  image: ${ERPNEXT_IMAGE:?set in versions.env}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: ${MARIADB_IMAGE:?set in versions.env}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: ${REDIS_IMAGE:?set in versions.env}
    restart: unless-stopped

  redis-queue:
    image: ${REDIS_IMAGE:?set in versions.env}
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    image: ${ERPNEXT_IMAGE:?set in versions.env}
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    image: ${ERPNEXT_IMAGE:?set in versions.env}
    restart: "no"
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
    command:
      - >
        test -d "sites/$$SITE_NAME" && echo "site exists" && exit 0;
        bench new-site "$$SITE_NAME" --mariadb-user-host-login-scope='%'
        --db-root-username root --db-root-password "$$DB_ROOT_PASSWORD"
        --admin-password "$$ADMIN_PASSWORD" --install-app erpnext --set-default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *erpnext

  websocket:
    <<: *erpnext
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *erpnext
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *erpnext
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: *erpnext
    command: ["bench", "schedule"]

  frontend:
    <<: *erpnext
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:${HTTP_PORT}:8080"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
